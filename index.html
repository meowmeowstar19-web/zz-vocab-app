<!DOCTYPE html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- interactive-widget=resizes-content: when the soft keyboard opens,
         shrink the LAYOUT viewport (so the fixed-height app shell fits above
         the keyboard) instead of letting the browser scroll the page to
         reveal the input — that scroll is what leaves the shell displaced
         with a white strip after repeated failed logins. Honoured by
         Chrome/Android; iOS Safari ignores it (handled by the keyboard-close
         scroll reset script below). Ported from miracleZZ (4b47940). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlushieWord" />
    <meta name="application-name" content="PlushieWord" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set <html lang> from saved native language BEFORE React mounts, so
      // first-paint font shaping is correct and the browser's auto-translate
      // detector never sees a mismatched lang.
      (function () {
        try {
          var n = localStorage.getItem('app_native');
          if (!n) {
            var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (var i = 0; i < langs.length; i++) {
              var c = (langs[i] || '').toLowerCase();
              if (c.indexOf('zh') === 0) { n = 'zh'; break; }
              if (c.indexOf('ja') === 0) { n = 'ja'; break; }
              if (c.indexOf('en') === 0) { n = 'en'; break; }
            }
          }
          document.documentElement.lang = n === 'zh' ? 'zh-CN' : n === 'ja' ? 'ja' : 'en';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Capture the install prompt before React mounts; Chrome only fires this
      // once and very early. Stash it on window for SettingsPage to consume.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new Event('appinstalled-custom'));
      });
      // Register service worker so Chrome treats us as installable
      // and so static assets are cached for offline / fast loads.
      // NEVER in local dev: a stale SW serves a cached shell that masks a
      // stopped/restarting dev server, showing a half-broken page (shell
      // loads, word images blank) instead of a clear connection error.
      if ('serviceWorker' in navigator) {
        var isLocalDev =
          ['localhost', '127.0.0.1', '0.0.0.0'].indexOf(location.hostname) !== -1 ||
          location.port === '5174';
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
        } else {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      }
    </script>
    <script>
      // iOS Safari leaves the page scrolled after the on-screen keyboard
      // closes. The app is a fixed-size shell, so that residual scroll
      // displaces it and exposes a white strip that grows on every re-open
      // (e.g. retrying a failed login). Force the page back to top once focus
      // leaves the inputs or the visual viewport settles. (miracleZZ 4b47940)
      (function () {
        function resetScroll() {
          requestAnimationFrame(function () {
            window.scrollTo(0, 0);
            if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
          });
        }
        window.addEventListener('focusout', function () {
          setTimeout(function () {
            var a = document.activeElement;
            var typing =
              a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
            if (!typing) resetScroll();
          }, 100);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            if (window.visualViewport.height >= window.innerHeight - 80) resetScroll();
          });
        }
        window.addEventListener('orientationchange', resetScroll);
      })();
    </script>
    <!-- Self-hosted Nunito (see @font-face in index.css). No external
         fonts.googleapis.com request — it render-blocks and stalls in China.
         Preload so the one 38KB woff2 starts downloading immediately. -->
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>PlushieWord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
